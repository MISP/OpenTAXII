[tox]
skipsdist = True
envlist = py{310,311,312,py3}-sqlalchemy14-werkzeug{lt21,gte21}-{sqlite,mysql,mariadb,postgres}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    pypy-3.10: pypy3

[testenv]
commands =
    py.test --cov {envsitepackagesdir}/opentaxii {posargs}
deps =
    !pypy3: -rrequirements-dev.txt
    # does not support recent mypy
    # https://github.com/python/mypy/issues/20329
    pypy3: -rrequirements-test.txt
    pypy3: -rrequirements.txt
    mysql-!pypy3,mariadb-!pypy3: -rrequirements-mysql.txt
    # mysqlclient 2.3 uses CPython thread-lock APIs unavailable on PyPy.
    mysql-pypy3,mariadb-pypy3: PyMySQL>=1.1.1
    postgres-!pypy3: -rrequirements-postgres.txt
    postgres-pypy3: -rrequirements-postgres-pypy.txt
    sqlalchemy14: sqlalchemy>=1.4,<1.5
    werkzeuglt21: werkzeug<2.1
    werkzeuggte21: werkzeug>=2.1
setenv =
    LC_ALL=en_US.UTF-8
    sqlite: DBTYPE=sqlite
    mysql: DBTYPE=mysql
    mariadb: DBTYPE=mariadb
    postgres: DBTYPE=postgres
    pypy3: PYTEST_ADDOPTS="--no-cov"
usedevelop = True

[testenv:py312-feed-round-trip]
deps =
    -rrequirements.txt
    -rrequirements-test.txt
    misp-stix==2026.11.12
    trustme==1.2.1
setenv =
    DBTYPE = sqlite
    TAXII21_CLIENT_ENV = {envtmpdir}/cabby
# The server and Cabby depend on different distributions of the libtaxii package.
commands_pre =
    python -m venv {envtmpdir}/cabby
    python -m pip --python {envtmpdir}/cabby install \
        misp-cabby@git+https://github.com/MISP/cabby.git@713ae437bc712853197e959c4e78ad0a5efbcf5b \
        misp-libtaxii@git+https://github.com/MISP/libtaxii.git@1c4bfa13731eb22c8fd6b674c2f5f0d48be72820
commands =
    python -m pytest --no-cov {posargs:tests/integration/test_misp_feed.py}
