name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+[ab]?[0-9]?'
    branches:
      - master
  pull_request:
    branches:
      - 'master'

permissions:
  contents: read

jobs:
  build-package:
    name: Build Python distributions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install packaging tools
      run: python -m pip install build twine
    - name: Build the wheel and source archive
      run: python -m build
    - name: Check distributions
      run: python -m twine check --strict dist/*
    - name: Check the release tag
      if: startsWith(github.ref, 'refs/tags/')
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        if [[ ! -f "dist/misp_opentaxii-${RELEASE_TAG}.tar.gz" ]]; then
          echo "::error::Release tag must match the version in opentaxii/_version.py."
          exit 1
        fi
    - name: Upload release distributions
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: distributions
        path: dist/
        if-no-files-found: error

  publish-package:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/misp-opentaxii/
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: distributions
        path: dist/
    - name: Create GitHub release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "dist/misp_opentaxii-*.whl,dist/misp_opentaxii-*.tar.gz"
        artifactErrorsFailBuild: true
        bodyFile: "CHANGES.md"
        skipIfReleaseExists: true
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          push: false
